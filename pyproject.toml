# 仅提供项目元数据与工具配置；本批不做发包。
# 注意：PyPI 上 "sanic-admin" 已被无关项目占用，因此 name 不使用该名称。
[project]
name = "sanic-admin-rbac"
version = "0.4.1"
description = "Sanic + Tortoise ORM + Vue 3 的全栈后台管理系统（RBAC）"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 127
target-version = "py310"
extend-exclude = ["frontend", "amis", "test", "app/generated", "tests/generated"]

[tool.ruff.lint]
# 硬拦截：语法错误与未定义名称；其余规则后续批次再逐步收紧
select = ["E9", "F63", "F7", "F82"]

[tool.aerich]
tortoise_orm = "app.aerich_config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
