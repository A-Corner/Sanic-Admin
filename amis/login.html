<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <title>登录 - Sanic Admin</title>
    <link rel="icon" type="image/png" href="images/icons/favicon.ico">
    <link rel="stylesheet" type="text/css"
        href="vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css"
        href="fonts/font-awesome-4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="vendor/animate/animate.css">
    <link rel="stylesheet" type="text/css"
        href="vendor/css-hamburgers/hamburgers.min.css">
    <link rel="stylesheet" type="text/css" href="vendor/select2/select2.min.css">
    <link rel="stylesheet" type="text/css" href="css/util.css">
    <link rel="stylesheet" type="text/css" href="css/main.css">
</head>

<body>
    <div class="limiter">
        <div class="container-login100">
            <div class="wrap-login100">
                <div class="login100-pic js-tilt" data-tilt>
                    <img src="images/img-01.png" alt="IMG">
                </div>

                <form class="login100-form validate-form" id="login-form" novalidate>
                    <span class="login100-form-title">
                        用户 - 登录
                    </span>

                    <div class="wrap-input100 validate-input" data-validate="Valid email is required: ex@abc.xyz">
                        <input class="input100" type="text" name="email" placeholder="Email">
                        <span class="focus-input100"></span>
                        <span class="symbol-input100">
                            <i class="fa fa-envelope" aria-hidden="true"></i>
                        </span>
                    </div>

                    <div class="wrap-input100 validate-input" data-validate="Password is required">
                        <input class="input100" type="password" name="pass" placeholder="Password">
                        <span class="focus-input100"></span>
                        <span class="symbol-input100">
                            <i class="fa fa-lock" aria-hidden="true"></i>
                        </span>
                    </div>

                    <div id="login-error" role="alert" class="text-center" style="color:#c80000;min-height:1.5em;margin-top:8px;display:none"></div>

                    <div class="container-login100-form-btn">
                        <button type="submit" class="login100-form-btn">
                            登录
                        </button>
                    </div>

                    <div class="text-center p-t-12">
                        <span class="txt1">
                            忘记密码
                        </span>
                        <a class="txt2" href="#">
                            用户名 / 密码
                        </a>
                    </div>

                    <div class="text-center p-t-136">
                        <a class="txt2" href="#">
                            创建你的账号
                            <i class="fa fa-long-arrow-right m-l-5" aria-hidden="true"></i>
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="vendor/jquery/jquery-3.2.1.min.js"></script>
    <script src="vendor/bootstrap/js/popper.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.min.js"></script>
    <script src="vendor/select2/select2.min.js"></script>
    <script src="vendor/tilt/tilt.jquery.min.js"></script>
    <script>
        $('.js-tilt').tilt({
            scale: 1.1
        })
    </script>
    <script>
        // 同源托管：页面与 API 同源，相对路径即可，无需 CORS 配置。
        // 后端把本目录挂在 /amis 下，静态资源用 './'，API 用 '/' 起的绝对路径。
        const API_BASE = window.SANIC_API_BASE || '';
        const form = document.getElementById('login-form');
        const emailInput = form.querySelector('input[name="email"]');
        const passwordInput = form.querySelector('input[name="pass"]');
        const errorBox = document.getElementById('login-error');
        const submitBtn = form.querySelector('button[type="submit"]');

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorBox.style.display = 'none';
            if (!emailInput.value.trim() || !passwordInput.value) {
                showError('请输入邮箱和密码');
                return;
            }
            submitBtn.disabled = true;
            try {
                const response = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput.value.trim(), password: passwordInput.value })
                });
                if (response.ok) {
                    // 会话由后端通过 HttpOnly 的 session Cookie 下发，前端不保存口令或令牌
                    window.location.href = './index.html';
                    return;
                }
                let msg = '登录失败（HTTP ' + response.status + '）';
                try {
                    const body = await response.json();
                    if (body && (body.message || body.msg)) msg = body.message || body.msg;
                } catch (e) { /* 非 JSON 响应，使用默认提示 */ }
                showError(msg);
            } catch (error) {
                console.error('请求错误', error);
                showError('无法连接后端服务，请确认服务已启动');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>

    <script src="js/main.js"></script>
</body>

</html>
