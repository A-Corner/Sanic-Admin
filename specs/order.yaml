# 订单：belongs_to customer 的示例规格。
resource: order
table: orders
plural: orders
label: 订单
description: 客户订单
fields:
  - name: title
    type: string
    max_length: 128
    required: true
    label: 标题
    list: true
    searchable: true
  - name: amount
    type: int
    # 最小单位整数（SPEC-005）：以「分」存储，1 元 = 100 分。
    # 不用 float：二进制浮点无法精确表示十进制小数，金额运算会累积误差。
    # 单位名称在 label（人看），倍数在本属性（程序看：校验 + 生成样例 + 拒绝小数）。
    unit_scale: 100
    required: true
    label: 金额（分）
    list: true
  - name: quantity
    type: int
    default: 1
    label: 数量
    list: true
  - name: status
    type: string
    max_length: 16
    default: pending
    choices: [pending, paid, cancelled]
    label: 状态
    list: true
belongs_to:
  - name: customer
    target: customer
    required: true
    label: 客户
    list: true
menu:
  icon: fa-receipt
  order: 70
