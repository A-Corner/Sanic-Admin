name: Sanic-Admin CI

on:
  push:
    # release/**：补丁版从 release/v0.3.x 拉 hotfix 分支，PR 目标通常是 release
    # 分支本身；不加这条，发补丁版的 PR 根本不会触发 CI。
    branches: [ main, master, develop, vj-mp3, 'release/**' ]
  pull_request:
    branches: [ main, master, develop, vj-mp3, 'release/**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Lint with ruff (hard fail on syntax errors / undefined names)
      run: ruff check . --select E9,F63,F7,F82

    # 规格即代码：生成物必须与 specs/ 一致。改了规格却没重新生成（或手改
    # 生成物）时这条会红，避免「规格说一套、代码跑另一套」的漂移。
    - name: Verify generated artifacts match specs
      run: python -m tools.specgen check

    # 迁移链必须覆盖当前模型：改了规格却没跑 `specgen migrate`，或手改了模型，
    # 这条会红。否则上线后才会因缺表/缺列报错。
    - name: Verify migrations match models
      run: python scripts/check_migrations.py
      env:
        SANIC_ENV: development
        INITIAL_ADMIN_PASSWORD: ci-check-only

    - name: Test with pytest
      run: pytest --cov=app tests/ --cov-report=xml

  # AMIS 浏览器端到端门禁。
  #
  # 为什么单独一个 job：它需要 playwright + 浏览器，装起来比 pytest 重得多，
  # 不该拖慢 3 个 Python 版本的矩阵。
  #
  # 为什么浏览器不可用时「跳过而不是通过」：这里用两段式判定——
  #   1) probe 步骤检测浏览器能否启动，能就输出 available=true；
  #   2) 真正跑 E2E 的步骤只在 available=true 时执行。
  # 若浏览器装不上，job 结论是「skipped」，GitHub 上显示为灰色跳过，
  # 不会变成绿色通过；同时 probe 步骤会写一条 ::warning:: 说明原因。
  # 想让它变成硬失败，把 `if: steps.probe.outputs.available == 'true'`
  # 换成 `if: always()` 即可。
  # 浏览器可用性探测（独立 job）：输出 available 供下游 job 的 if 判定。
  # 这样「浏览器不可用」在下游 job 上体现为**真正的 skipped 结论**，
  # 而不是「step 跳过、job 仍绿」——后者会把「没验证」伪装成「通过」。
  amis-e2e-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      available: ${{ steps.probe.outputs.available }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install Playwright
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt playwright
        python -m playwright install --with-deps chromium

    - name: Probe browser availability
      id: probe
      run: |
        if python - <<'PY'
        from playwright.sync_api import sync_playwright
        with sync_playwright() as pw:
            b = pw.chromium.launch(headless=True)
            b.close()
        PY
        then
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "browser available"
        else
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Playwright Chromium 无法启动；下游 amis-e2e job 将被跳过（不会显示为通过）"
        fi

  # 真正的门禁 job：浏览器不可用时整体 skipped（GitHub 会明确标注），不是绿色通过。
  amis-e2e:
    needs: amis-e2e-probe
    if: needs.amis-e2e-probe.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies and Playwright
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt playwright
        python -m playwright install --with-deps chromium

    - name: Start app
      env:
        SANIC_ENV: development
        DATABASE_URL: sqlite:///tmp/ci-e2e.sqlite3
        CACHE_TYPE: memory
        INITIAL_ADMIN_PASSWORD: CiE2ePass#2026
        AUTO_RELOAD: "false"
      run: |
        mkdir -p tmp
        python main.py > tmp/server.log 2>&1 &
        # 轮询 /health：首次启动可能要生成 RSA 密钥并建表，给足 60 秒。
        for i in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:22222/health > /dev/null 2>&1; then
            echo "server healthy after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "::error::服务 60 秒内未就绪"
        tail -50 tmp/server.log
        exit 1

    - name: Run AMIS E2E
      env:
        INITIAL_ADMIN_PASSWORD: CiE2ePass#2026
      run: |
        # 初始管理员 must_change_password=True，首次登录必须走强制改密，
        # 否则登录页停在改密表单、跳不到管理台。
        python scripts/amis_e2e_check.py \
          --base-url http://127.0.0.1:22222 \
          --admin-email SAdmin@Sanic.com \
          --admin-password "$INITIAL_ADMIN_PASSWORD" \
          --new-password 'CiE2ePass#2026-new'

    - name: Negative control — broken selector must fail the check
      env:
        INITIAL_ADMIN_PASSWORD: CiE2ePass#2026-new   # 上一步已完成改密
      run: |
        # 正向对照：故意把弹窗选择器改错，脚本要求「新增角色」这条断言失败。
        # 若它仍然通过，说明该断言是恒真的，门禁没有意义 —— 脚本以退出码 1 报警。
        python scripts/amis_e2e_check.py \
          --base-url http://127.0.0.1:22222 \
          --admin-email SAdmin@Sanic.com \
          --admin-password "$INITIAL_ADMIN_PASSWORD" \
          --negative-control dialog

    - name: Show server log on failure
      if: failure()
      run: tail -100 tmp/server.log || true

  # ---------------------------------------------------------------------------
  # 方言 DDL 实跑：MySQL / PostgreSQL 的真实 DDL 必须能执行
  #
  # 为什么要有这个 job：`check_migrations` 只把迁移 DDL 当**文本**比对，从不执行。
  # MySQL 的 DDL 与 SQLite 差别很大（反引号、AUTO_INCREMENT、COMMENT、DATETIME(6)），
  # 语法错误在只跑 SQLite 的 CI 里一路绿灯，到生产才炸。真实案例：
  # `migrations/dialects/mysql/0_*_init.py` 里写 `\'`，被 Python 还原成裸引号，
  # 任何 MySQL 全新部署都在基线第一步就报 1064。
  #
  # 这个 job 跑在 GitHub runner 上（不是本机），用 services 起真库。
  # ---------------------------------------------------------------------------
  migrations-dialects:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: mysql
            image: mysql:8.0
            port: 3306
            fresh_url: mysql://root:root@127.0.0.1:3306/sanic_a
            existing_url: mysql://root:root@127.0.0.1:3306/sanic_a_ex
            health: >-
              --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
              --health-interval=10s --health-timeout=5s --health-retries=12
          - dialect: postgres
            image: postgres:16
            port: 5432
            fresh_url: postgres://postgres:root@127.0.0.1:5432/sanic_a
            existing_url: postgres://postgres:root@127.0.0.1:5432/sanic_a_ex
            health: >-
              --health-cmd="pg_isready -U postgres"
              --health-interval=10s --health-timeout=5s --health-retries=12

    services:
      db:
        image: ${{ matrix.image }}
        # 两个镜像的环境变量都写上：各自只读自己认识的，多余的会被忽略。
        # 不用 `env: ${{ matrix.db_env }}` —— GitHub Actions 不支持用表达式整体
        # 替换一个 mapping，那种写法不会报错但可能静默得到空 env。
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sanic_a
          POSTGRES_PASSWORD: root
          POSTGRES_DB: sanic_a
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: ${{ matrix.health }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install asyncmy asyncpg

    - name: Install the target dialect's migration baseline
      run: python scripts/migrations/select_dialect_baseline.py ${{ matrix.dialect }}

    # 新库：空库跑完整迁移链（基线 0_* + 增量 1_*），再用 information_schema
    # 断言关键列的类型/唯一/外键。MySQL 的 DDL 语法错误会在这里直接炸。
    - name: "New database: full chain (baseline + increment)"
      env:
        SANIC_ENV: development
        INITIAL_ADMIN_PASSWORD: ci-check-only
      run: python scripts/check_dialect_ddl.py ${{ matrix.dialect }} "${{ matrix.fresh_url }}"

    # 存量库：先用当前模型建表（模拟 v0.3.2 的 generate_schemas 库），再基线化，
    # 再 upgrade —— 断言只应用增量、基线不重跑。
    - name: "Existing database: increment only"
      env:
        SANIC_ENV: development
        INITIAL_ADMIN_PASSWORD: ci-check-only
      run: python scripts/check_dialect_ddl.py ${{ matrix.dialect }} "${{ matrix.existing_url }}" --existing
