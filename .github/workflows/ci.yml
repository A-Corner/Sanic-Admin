name: Sanic-Admin CI

on:
  push:
    branches: [ main, master, develop, vj-mp3 ]
  pull_request:
    branches: [ main, master, develop, vj-mp3 ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Lint with ruff (hard fail on syntax errors / undefined names)
      run: ruff check . --select E9,F63,F7,F82

    # 规格即代码：生成物必须与 specs/ 一致。改了规格却没重新生成（或手改
    # 生成物）时这条会红，避免「规格说一套、代码跑另一套」的漂移。
    - name: Verify generated artifacts match specs
      run: python -m tools.specgen check

    - name: Test with pytest
      run: pytest --cov=app tests/ --cov-report=xml
