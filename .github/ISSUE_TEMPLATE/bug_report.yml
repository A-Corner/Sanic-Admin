name: Bug 报告
description: 报告一个缺陷
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        安全漏洞请不要在此提交，请按 SECURITY.md 通过 GitHub 私下漏洞报告提交。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为与实际行为
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: Python 版本、操作系统、提交 SHA 或分支
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请先去除密钥、口令等敏感信息。
      render: shell
